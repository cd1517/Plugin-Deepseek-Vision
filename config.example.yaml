plugins:
  enabled: true
  configs:
    deepseek-vision:
      enabled: true
      priority: 100
      target_models:
        - deepseek-v4-flash

      # Reuse a vision model and credentials already configured in CLIProxyAPI
      # through the native host.model.execute callback.
      vision_model: gpt-5.6-luna
      # Optional ordered fallbacks. The primary vision_model is tried first;
      # at most three additional models available through CLIProxyAPI may be listed here.
      vision_fallback_models: []

      language: zh
      request_timeout_seconds: 120
      # Global backpressure for host vision callbacks. Prompt groups queue
      # instead of being rejected when all slots are busy.
      max_inflight_vision_requests: 4
      # Last-resort unique-image ceiling; ordinary multi-image prompts are sent
      # to Luna together and do not use this as a batch size.
      emergency_max_images_per_request: 256
      max_request_bytes: 20971520
      max_image_reference_bytes: 15728640
      max_response_bytes: 4194304
      max_result_chars: 20000

      # Ordinary derived-text cache. Set size to 0 to disable ordinary reuse;
      # refresh call-ID idempotency remains separately bounded.
      analysis_cache_size: 128
      analysis_cache_ttl_seconds: 900
      analysis_url_cache_ttl_seconds: 120

      # Allow only declared, controlled rich tool-output reanalysis. Disabled
      # by default; enabling it can preserve strictly validated Codex
      # attachment paths when the request declares view_image.
      agent_reanalysis_enabled: false

      # Some Anthropic-compatible models (including GLM deployments) only
      # consume tool_result.content[0]. Merge rewritten tool-result text into
      # that first block without changing ordinary user-message image blocks.
      claude_tool_result_single_block_compat: false

      # High-sensitivity debugging only. Writes complete plaintext request,
      # image references/data URIs, VLM payloads/results, and rewritten bodies to
      # logs/deepseek-vision-trace/. Credential headers remain redacted.
      trace_enabled: false
